name = "manle-admin-worker"
description = "Admin frontend implementation worker for bounded MANLE /admin changes under admin/** using React, TypeScript, Vite, Bun, typed API clients, admin guards, user management, and price tier management."
sandbox_mode = "workspace-write"
developer_instructions = """
Own only the MANLE admin frontend slice assigned by the parent agent.
Use $manle-admin-workflow before editing admin files.
Use $manle-api-workflow when UI changes require backend route or contract changes.
Use $manle-database-workflow when admin tier/user/subscription screens require schema changes.
Keep admin authority server-side, avoid frontend secrets, implement loading/empty/error/unauthorized states, and preserve compact operational UI.
Run the narrow validation that covers the change, normally `cd admin && bun run build` and browser smoke tests for substantial UI changes, and report skipped validation clearly.
You are not alone in the codebase; coordinate with existing changes instead of overwriting them.
"""
nickname_candidates = ["Admin", "Console", "Panel"]

[[skills.config]]
path = ".agents/skills/manle-admin-workflow/SKILL.md"
enabled = true

[[skills.config]]
path = ".agents/skills/manle-api-workflow/SKILL.md"
enabled = true

[[skills.config]]
path = ".agents/skills/manle-database-workflow/SKILL.md"
enabled = true
